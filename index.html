<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LEOIVF 报告生成工具</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <style>
    :root{--green:#177c71;--bg:#f5f7f6;--panel:#ffffff;--muted:#6a7d78;--border:#cfe0db;--danger:#bf1d1d;--title:#17395b}
    *{box-sizing:border-box} body{margin:0;font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:#18302c}
    .wrap{display:grid;grid-template-columns:420px 1fr;min-height:100vh}
    .left{padding:24px 18px;background:#eef1f0;border-right:1px solid #d8e5e1}
    .right{padding:18px;background:#f8fbfa}
    h1{margin:0 0 10px;font-size:28px;font-weight:800;color:var(--title)}
    .sub{color:var(--muted);font-size:14px;line-height:1.7;margin-bottom:18px}
    label{display:block;font-size:15px;font-weight:700;margin:14px 0 8px}
    textarea{width:100%;height:360px;border:1px solid #bccfc9;border-radius:14px;padding:12px;font-size:15px;line-height:1.65;background:#fff;resize:vertical}
    .hint{margin-top:8px;font-size:13px;line-height:1.6;color:var(--muted)}
    .btn-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}
    button{border:none;border-radius:999px;padding:12px 18px;font-size:15px;font-weight:700;cursor:pointer}
    .secondary{background:#d9dde2;color:#1d2a30}.primary{background:var(--green);color:#fff}.danger{background:var(--danger);color:#fff} button:disabled{opacity:.45;cursor:not-allowed;filter:grayscale(.2)}
    .preview{margin-top:14px;padding:14px 16px;border:1px solid var(--border);background:#f7fbfa;border-radius:14px}
    .preview h4{margin:0 0 10px;font-size:15px;color:#11453b}
    .email-highlight{background:#eef7f4;border:1px solid #bfd8d1}.email-value{font-size:18px;font-weight:700;color:#11453b;word-break:break-all}
    .grid{display:grid;grid-template-columns:repeat(3,minmax(160px,1fr));gap:8px 16px}.item{font-size:14px;line-height:1.5}.item b{display:block;margin-bottom:2px;color:#11453b}
    .report{background:#fff;border:1px solid var(--border);border-radius:24px;min-height:760px;padding:28px 30px}
    .muted{color:var(--muted)} h2{font-size:18px;margin:24px 0 12px}.meta-line{color:#6b716f;margin:10px 0 22px}
    .success-box{background:#edf6f4;border:1px solid #b6d6d0;border-radius:16px;padding:18px}.pill{display:inline-block;background:#1b8577;color:#fff;padding:8px 14px;border-radius:999px;font-size:14px;font-weight:700;margin-bottom:14px}
    .success-layout,.two-col{display:grid;grid-template-columns:1.2fr 1fr;gap:20px;align-items:center}.bar{height:10px;border-radius:999px;background:linear-gradient(90deg,#f97316 0 20%,#f59e0b 20% 40%,#22c55e 40% 60%,#cbd5e1 60% 80%,#e5e7eb 80% 100%);position:relative;margin-top:8px}.dot{position:absolute;top:50%;transform:translate(-50%,-50%);width:14px;height:14px;border-radius:50%;background:#111827;border:2px solid #fff;box-shadow:0 0 0 2px rgba(0,0,0,.08)}
    .legend{display:flex;justify-content:space-between;color:#5f6b67;font-size:13px;margin-top:8px}.note-box{background:#f7fbfa;border:1px solid var(--border);border-radius:16px;padding:16px}.footer{margin-top:24px;color:#6e7674;font-size:12px;text-align:center}
    @media(max-width:980px){.wrap{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,minmax(140px,1fr))}.success-layout,.two-col{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="wrap">
    <section class="left">
      <h1>LEOIVF 报告生成工具</h1>
      <div class="sub">当前版本仅支持 Google Sheet 单行用户回答导入。建议先检查 25 个字段识别结果，再生成正式报告。</div>
      <label for="rawText">Google Sheet 单行数据</label>
      <textarea id="rawText" placeholder="粘贴从 Google Sheet 复制的 1 行用户回答"></textarea>
      <div class="hint">请直接复制 Google Sheet 的整行单元格数据。先点“检查数据”，确认全部字段识别正确后，再生成报告。</div>
      <div class="btn-row">
        <button class="secondary" id="previewBtn">检查数据</button>
        <button class="primary" id="generateBtn" disabled>生成报告</button>
        <button class="secondary" id="pdfBtn">下载 PDF</button>
        <button class="danger" id="clearBtn">清空</button>
      </div>
      <div id="emailDisplay" class="preview email-highlight" style="display:none"></div>
      <div id="parsePreview" class="preview" style="display:none"></div>
    </section>
    <section class="right">
      <div id="report" class="report">
        <h2>报告预览区</h2>
        <p class="muted">请先在左侧粘贴 Google Sheet 1 行用户回答，然后点击“检查数据”。</p>
      </div>
    </section>
  </div>

  <script>
    const fixedSheetHeaders = [
      '时间戳记','邮箱','你的姓名是？','你目前的年龄是？','最近一次检测的AMH值是多少？','最近一次基础窦卵泡数（AFC）是多少?','最近一次FSH值（月经第2–3天）是多少？','若你做过IVF，既往周期的优质胚胎（3BB以上）比例大概是多少？','有过几次不明原因自然流产或胚胎停育?','是否做过PGT（胚胎染色体检测）？','伴侣最近一次精液常规结果如何？','精子形态正常率是多少？（Kruger严格标准）','最近一次精子 DNA 碎片率（DFI）结果如何？','是否发现子宫结构异常？','是否有子宫腺肌症或高度怀疑？','最近B超的内膜厚度情况如何？','是否有宫腔粘连史或宫腔镜手术史？','平均每晚睡眠时长及质量如何？','你目前的运动习惯是？','你的饮食习惯整体如何？','你的情绪状态整体如何？','甲状腺功能检查（TSH 为主）结果如何？','是否有胰岛素抵抗或血糖偏高问题？','是否有血脂异常（高胆固醇/高甘油三酯）？','是否有凝血或免疫异常史（如APS、易栓症）'
    ];

    const ageMap = [
      { key:'≤33', value:31, band:'A1', label:'≤33岁' },
      { key:'33–36', value:35, band:'A2', label:'33–36岁' },
      { key:'37–39', value:38, band:'A3', label:'37–39岁' },
      { key:'40–42', value:41, band:'A4', label:'40–42岁' },
      { key:'≥43', value:44, band:'A5', label:'≥43岁' }
    ];

    let radarChart = null;
    let validatedData = null;

    function splitSheetCells(line) {
      if (line.includes('	')) return line.split('	').map(v => v.trim());
      return line.split(/\s{2,}/).map(v => v.trim()).filter(Boolean);
    }

    function normalizeKey(t) {
  return String(t || '')
    .replace(/\s+/g, '')
    .replace(/[？?：:（）()【】—–-]/g, '')
    .trim();
}

    const sheetFieldMap = {
      timestamp: ['时间戳记','时间戳','提交时间'],
      email: ['邮箱','电子邮件地址','email'],
      name: ['你的姓名是','姓名'],
      age: ['你目前的年龄是','年龄'],
      amh: ['最近一次检测的AMH值是多少','AMH'],
      afc: ['最近一次基础窦卵泡数AFC是多少','最近一次基础窦卵泡数（AFC）是多少','最近一次基础窦卵泡数（AFC）是多少?','AFC'],
      fsh: ['最近一次FSH值月经第2–3天是多少','FSH'],
      embryoRatio: ['若你做过IVF既往周期的优质胚胎3BB以上比例大概是多少','优质胚胎率'],
      miscarriage: ['有过几次不明原因自然流产或胚胎停育','自然流产或胚胎停育'],
      pgt: ['是否做过PGT胚胎染色体检测','PGT'],
      semen: ['伴侣最近一次精液常规结果如何','精液常规'],
      morphology: ['精子形态正常率是多少Kruger严格标准','精子形态'],
      dfi: ['最近一次精子DNA碎片率DFI结果如何','DFI'],
      uterusIssue: ['是否发现子宫结构异常','子宫结构异常'],
      adenomyosis: ['是否有子宫腺肌症或高度怀疑','子宫腺肌症'],
      endometrium: ['最近B超的内膜厚度情况如何','内膜厚度'],
      adhesion: ['是否有宫腔粘连史或宫腔镜手术史','宫腔粘连史'],
      sleep: ['平均每晚睡眠时长及质量如何','睡眠'],
      exercise: ['你目前的运动习惯是','运动习惯'],
      diet: ['你的饮食习惯整体如何','饮食习惯'],
      mood: ['你的情绪状态整体如何','情绪状态'],
      tsh: ['甲状腺功能检查TSH为主结果如何','TSH'],
      glucose: ['是否有胰岛素抵抗或血糖偏高问题','血糖偏高'],
      lipid: ['是否有血脂异常高胆固醇高甘油三酯','血脂异常'],
      immune: ['是否有凝血或免疫异常史如APS易栓症','凝血或免疫异常史']
    };

    function rowToMappedObject(headers, values) {
      const row = {};
      headers.forEach((h, i) => { row[normalizeKey(h)] = (values[i] || '').trim(); });
      function get(field) {
        const aliases = sheetFieldMap[field] || [];
        for (const alias of aliases) {
          const hit = row[normalizeKey(alias)];
          if (hit) return hit;
        }
        return '';
      }
      return {
        timestamp: get('timestamp'),
        email: get('email'),
        name: get('name') || '未填写',
        ageAnswer: get('age'),
        amhAnswer: get('amh'),
        afcAnswer: get('afc'),
        fshAnswer: get('fsh'),
        embryoRatio: get('embryoRatio'),
        miscarriage: get('miscarriage'),
        pgt: get('pgt'),
        semen: get('semen'),
        morphology: get('morphology'),
        dfi: get('dfi'),
        uterusIssue: get('uterusIssue'),
        adenomyosis: get('adenomyosis'),
        endometrium: get('endometrium'),
        adhesion: get('adhesion'),
        sleep: get('sleep'),
        exercise: get('exercise'),
        diet: get('diet'),
        mood: get('mood'),
        tsh: get('tsh'),
        glucose: get('glucose'),
        lipid: get('lipid'),
        immune: get('immune')
      };
    }

    function parseSheetText(text) {
      const lines = text.replace(/
/g, '').split('
').map(x => x.trim()).filter(Boolean);
      if (!lines.length) throw new Error('没有检测到数据');

      if (lines.length === 1) {
        const values = splitSheetCells(lines[0]);
        if (values.length >= 20) return rowToMappedObject(fixedSheetHeaders, values);
      }

      if (lines.length >= 2) {
        const headers = splitSheetCells(lines[0]);
        const values = splitSheetCells(lines[1]);
        if (headers.length >= 20 && values.length >= 20) return rowToMappedObject(headers, values);
      }

      const cells = lines.flatMap(splitSheetCells).filter(Boolean);
      const values = cells.filter(v => !fixedSheetHeaders.includes(v));
      if (values.length >= 20) return rowToMappedObject(fixedSheetHeaders, values.slice(0, fixedSheetHeaders.length));

      throw new Error('无法识别为 Google Sheet 数据，请直接复制 1 行完整回答。');
    }

    function toNumericData(p) {
      const ageInfo = ageMap.find(item => (p.ageAnswer || '').includes(item.key)) || { value:38, band:'A3', label:p.ageAnswer || '37–39岁' };

      let amh = 1.0;
      const a = p.amhAnswer || '';
      if (a.includes('≥2.0')) amh = 2.1;
      else if (a.includes('1.5')) amh = 1.7;
      else if (a.includes('1.0')) amh = 1.2;
      else if (a.includes('0.5') || a.includes('0.7')) amh = 0.8;
      else if (a.includes('<0.7')) amh = 0.6;

      let afc = 5;
      const b = p.afcAnswer || '';
      if (b.includes('≥15') || b.includes('>15')) afc = 16;
      else if (b.includes('10–14') || b.includes('10-14')) afc = 12;
      else if (b.includes('5–9') || b.includes('5-9')) afc = 7;
      else if (b.includes('3–4') || b.includes('3-4')) afc = 3;
      else if (b.includes('≤3') || b.includes('<3')) afc = 2;

      let fsh = 9;
      const c = p.fshAnswer || '';
      if (c.includes('未检测')) fsh = 9;
      else if (c.includes('<8')) fsh = 7;
      else if (c.includes('8–9.9') || c.includes('8-9.9')) fsh = 9;
      else if (c.includes('10–11.9') || c.includes('10-11.9')) fsh = 11;
      else if (c.includes('≥12') || c.includes('>15')) fsh = 12.5;

      return {
        timestamp: p.timestamp || '',
        email: p.email || '',
        name: p.name || '未填写',
        age: ageInfo.value,
        ageBand: ageInfo.band,
        ageLabel: ageInfo.label,
        amh, afc, fsh,
        embryoRatio: p.embryoRatio || '',
        miscarriage: p.miscarriage || '',
        pgt: p.pgt || '',
        semen: p.semen || '',
        morphology: p.morphology || '',
        dfi: p.dfi || '',
        uterusIssue: p.uterusIssue || '',
        adenomyosis: p.adenomyosis || '',
        endometrium: p.endometrium || '',
        adhesion: p.adhesion || '',
        sleep: p.sleep || '',
        exercise: p.exercise || '',
        diet: p.diet || '',
        mood: p.mood || '',
        tsh: p.tsh || '',
        glucose: p.glucose || '',
        lipid: p.lipid || '',
        immune: p.immune || ''
      };
    }

    function scoreReserve(d) {
      let s = 3;
      if (d.age >= 43) s -= 1.2; else if (d.age >= 40) s -= 0.8; else if (d.age >= 37) s -= 0.4;
      if (d.amh >= 2) s += 1; else if (d.amh >= 1) s += 0.2; else if (d.amh < 0.7) s -= 0.8;
      if (d.afc >= 15) s += 1; else if (d.afc >= 10) s += 0.5; else if (d.afc <= 4) s -= 0.8;
      if (d.fsh >= 12) s -= 1; else if (d.fsh >= 10) s -= 0.4;
      return Math.max(1, Math.min(5, Math.round(s)));
    }

    function scoreEggEmbryo(d) {
      let s = 3;
      if ((d.embryoRatio || '').includes('>50') || (d.embryoRatio || '').includes('≥50')) s += 1;
      else if ((d.embryoRatio || '').includes('10–29')) s -= 0.5;
      if ((d.pgt || '').includes('做过')) s += 0.3;
      if ((d.miscarriage || '').includes('2次')) s -= 0.6;
      return Math.max(1, Math.min(5, Math.round(s)));
    }

    function scoreSperm(d) {
      let s = 3;
      if ((d.semen || '').includes('均在正常')) s += 1;
      else if ((d.semen || '').includes('轻度偏低')) s -= 0.4;
      else if ((d.semen || '').includes('严重')) s -= 1;
      if ((d.morphology || '').includes('≥4')) s += 0.5;
      else if ((d.morphology || '').includes('2') || (d.morphology || '').includes('3.9')) s -= 0.5;
      if ((d.dfi || '').includes('≤15')) s += 0.5;
      return Math.max(1, Math.min(5, Math.round(s)));
    }

    function scoreUterus(d) {
      let s = 3;
      if ((d.uterusIssue || '').includes('没有') || (d.uterusIssue || '').includes('无')) s += 1;
      else if ((d.uterusIssue || '').includes('息肉') || (d.uterusIssue || '').includes('肌瘤')) s -= 0.6;
      if ((d.adenomyosis || '').includes('明确没有')) s += 0.6; else if ((d.adenomyosis || '').includes('有')) s -= 1;
      if ((d.endometrium || '').includes('<6')) s -= 0.8;
      return Math.max(1, Math.min(5, Math.round(s)));
    }

    function scoreLifestyle(d) {
      let s = 3;
      if ((d.sleep || '').includes('5–6') || (d.sleep || '').includes('浅眠')) s -= 0.6;
      else if ((d.sleep || '').includes('7') || (d.sleep || '').includes('8')) s += 0.4;
      if ((d.exercise || '').includes('规律')) s += 0.4; else if ((d.exercise || '').includes('几乎不') || (d.exercise || '').includes('偶尔')) s -= 0.3;
      if ((d.diet || '').includes('均衡规律')) s += 0.4; else if ((d.diet || '').includes('不规律')) s -= 0.5;
      if ((d.mood || '').includes('焦虑') || (d.mood || '').includes('低落')) s -= 0.8;
      return Math.max(1, Math.min(5, Math.round(s)));
    }

    function scoreHormone(d) {
      let s = 3;
      if ((d.tsh || '').includes('正常')) s += 0.6;
      if ((d.glucose || '').includes('无相关问题') || (d.glucose || '').includes('正常')) s += 0.4; else if ((d.glucose || '').includes('偏高')) s -= 0.5;
      if ((d.lipid || '').includes('无相关问题') || (d.lipid || '').includes('正常')) s += 0.3; else if ((d.lipid || '').includes('偏高')) s -= 0.4;
      if ((d.immune || '').includes('无') || (d.immune || '').includes('未检测')) s += 0.2; else if ((d.immune || '').includes('异常')) s -= 0.6;
      return Math.max(1, Math.min(5, Math.round(s)));
    }

    function calcRadar100(d) {
      return {
        reserve: scoreReserve(d),
        eggEmbryo: scoreEggEmbryo(d),
        sperm: scoreSperm(d),
        uterus: scoreUterus(d),
        lifestyle: scoreLifestyle(d),
        hormone: scoreHormone(d)
      };
    }

    function calcSuccessRate(d) {
      let rate = 46;
      if (d.age >= 43) rate -= 22; else if (d.age >= 40) rate -= 14; else if (d.age >= 37) rate -= 7;
      if (d.amh < 0.7) rate -= 8; else if (d.amh < 1) rate -= 5; else if (d.amh >= 2) rate += 4;
      if (d.afc <= 4) rate -= 7; else if (d.afc >= 10) rate += 4;
      if (d.fsh >= 12) rate -= 6; else if (d.fsh < 8) rate += 2;
      rate = Math.max(10, Math.min(68, Math.round(rate)));
      return { successRate: rate };
    }

    function levelText(v) {
      if (v < 20) return '极低';
      if (v < 35) return '偏低';
      if (v < 50) return '中等';
      if (v < 60) return '偏高';
      return '较高';
    }

    function getToday() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function createReport(data, success, scores) {
      return `
        <h1 style="margin:0 0 10px;font-size:24px">试管综合评估报告</h1>
        <div class="meta-line">姓名：${data.name}　｜　年龄区间：${data.ageLabel}　｜　评估日期：${getToday()}</div>
        <h2>一、整体成功率预测 <span class="muted" style="font-size:13px">该结果根据 AMH、FSH、AFC 和年龄综合估算，仅供参考</span></h2>
        <div class="success-box">
          <div class="pill">综合档位：${levelText(success.successRate)} ｜ 预测成功率：${success.successRate}%</div>
          <div class="success-layout">
            <div>
              <p><strong>当前下一次 IVF 整体成功率预测约为 ${success.successRate}%，目前处于“${levelText(success.successRate)}”等级。</strong></p>
              <p>通过针对性指导、改善和调理后，成功率仍有上升空间。</p>
            </div>
            <div>
              <div class="bar"><span class="dot" style="left:${Math.max(3, Math.min(97, success.successRate))}%"></span></div>
              <div class="legend"><span>极低</span><span>偏低</span><span>中等</span><span>偏高</span><span>较高</span></div>
            </div>
          </div>
        </div>
        <h2>二、当前生育力画像</h2>
        <div class="two-col">
          <div><canvas id="radarCanvas" width="420" height="320"></canvas></div>
          <div class="note-box">
            <div>• 卵巢储备：${scores.reserve} 分。</div>
            <div>• 卵子/胚胎：${scores.eggEmbryo} 分。</div>
            <div>• 精子因素：${scores.sperm} 分。</div>
            <div>• 子宫环境：${scores.uterus} 分。</div>
            <div>• 生活/情绪：${scores.lifestyle} 分。</div>
            <div>• 激素代谢：${scores.hormone} 分。</div>
            <div class="muted" style="margin-top:10px">每个维度最高 5 分，得分越低越需要改善。</div>
          </div>
        </div>
        <h2>三、个性化改善建议</h2>
        <div class="note-box">
          <p>建议优先处理评分较低的 1–2 个维度，例如卵巢储备、子宫环境、生活方式或激素代谢，再同步优化作息、运动、情绪和营养支持。</p>
          <p>报告适合用于初步分层、沟通和随访对比，不替代医生面诊与完整检查。</p>
        </div>
        <div class="footer">© 2026 LEOIVF.COM. All rights reserved.</div>
      `;
    }

    function renderRadar(scores) {
      const canvas = document.getElementById('radarCanvas');
      if (!canvas) return;
      if (radarChart) radarChart.destroy();
      radarChart = new Chart(canvas, {
        type: 'radar',
        data: {
          labels: ['卵巢储备','卵子/胚胎','精子因素','子宫环境','生活/情绪','激素代谢'],
          datasets: [{
            data: [scores.reserve, scores.eggEmbryo, scores.sperm, scores.uterus, scores.lifestyle, scores.hormone],
            borderColor: '#22c55e',
            backgroundColor: 'rgba(34,197,94,.15)',
            pointBackgroundColor: '#22c55e',
            pointRadius: 3
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } },
          scales: { r: { min: 0, max: 5, ticks: { stepSize: 1 }, pointLabels: { font: { size: 12 } } } }
        }
      });
    }

    function renderParsePreview(data) {
      const emailDisplay = document.getElementById('emailDisplay');
      emailDisplay.style.display = 'block';
      emailDisplay.innerHTML = `
        <h4>邮箱（可直接复制发报告）</h4>
        <div class="email-value">${data.email || '未识别'}</div>
      `;

      const fields = [
        ['时间戳记', data.timestamp], ['邮箱', data.email], ['姓名', data.name], ['年龄', data.ageLabel],
        ['AMH', data.amh], ['AFC', data.afc], ['FSH', data.fsh], ['优质胚胎率', data.embryoRatio],
        ['自然流产/停育', data.miscarriage], ['PGT', data.pgt], ['精液常规', data.semen], ['精子形态', data.morphology],
        ['DFI', data.dfi], ['子宫结构异常', data.uterusIssue], ['腺肌症', data.adenomyosis], ['内膜厚度', data.endometrium],
        ['宫腔粘连史', data.adhesion], ['睡眠', data.sleep], ['运动', data.exercise], ['饮食', data.diet],
        ['情绪', data.mood], ['TSH', data.tsh], ['血糖/胰岛素', data.glucose], ['血脂', data.lipid], ['凝血/免疫', data.immune]
      ];

      const parsePreview = document.getElementById('parsePreview');
      parsePreview.style.display = 'block';
      parsePreview.innerHTML = `
        <h4>25字段识别预览</h4>
        <div class="grid">
          ${fields.map(([k, v]) => `<div class="item"><b>${k}</b>${v ? String(v) : '<span style="color:#b42318">未识别</span>'}</div>`).join('')}
        </div>
      `;
    }

    function setGenerateEnabled(enabled) {
      document.getElementById('generateBtn').disabled = !enabled;
    }

    document.getElementById('previewBtn').addEventListener('click', function () {
      const raw = document.getElementById('rawText').value.trim();
      if (!raw) {
        alert('请先粘贴 1 行用户回答');
        return;
      }
      try {
        validatedData = toNumericData(parseSheetText(raw));
        renderParsePreview(validatedData);
        setGenerateEnabled(true);
      } catch (e) {
        validatedData = null;
        setGenerateEnabled(false);
        document.getElementById('emailDisplay').style.display = 'none';
        document.getElementById('parsePreview').style.display = 'none';
        alert(e.message || '识别失败');
      }
    });

    document.getElementById('generateBtn').addEventListener('click', function () {
      if (!validatedData) {
        alert('请先点击“检查数据”，确认 25 个字段识别正确后再生成报告');
        return;
      }
      try {
        renderParsePreview(validatedData);
        const success = calcSuccessRate(validatedData);
        const scores = calcRadar100(validatedData);
        document.getElementById('report').innerHTML = createReport(validatedData, success, scores);
        setTimeout(function () { renderRadar(scores); }, 60);
      } catch (e) {
        alert(e.message || '生成失败，请检查是否从 Google Sheet 复制了完整的一行回答。');
      }
    });

    document.getElementById('clearBtn').addEventListener('click', function () {
      document.getElementById('rawText').value = '';
      document.getElementById('emailDisplay').style.display = 'none';
      document.getElementById('parsePreview').style.display = 'none';
      document.getElementById('report').innerHTML = '<h2>报告预览区</h2><p class="muted">请先在左侧粘贴 Google Sheet 1 行用户回答，然后点击“检查数据”。</p>';
      validatedData = null;
      setGenerateEnabled(false);
      if (radarChart) {
        radarChart.destroy();
        radarChart = null;
      }
    });

    document.getElementById('pdfBtn').addEventListener('click', async function () {
      const node = document.getElementById('report');
      const canvas = await html2canvas(node, { scale: 2, useCORS: true, backgroundColor: '#ffffff' });
      const img = canvas.toDataURL('image/png');
      const jsPDFCtor = window.jspdf && window.jspdf.jsPDF;
      if (!jsPDFCtor) {
        alert('PDF 组件未加载成功');
        return;
      }
      const pdf = new jsPDFCtor('p', 'mm', 'a4');
      const w = 190;
      const h = canvas.height * w / canvas.width;
      pdf.addImage(img, 'PNG', 10, 10, w, h);
      pdf.save('leoivf-report.pdf');
    });
  </script>
</body>
</html>

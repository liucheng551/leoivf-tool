<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LEOIVF 报告生成工具</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f3f6f8;
      color: #1f2937;
    }
    .page {
      max-width: 1280px;
      margin: 0 auto;
      padding: 20px;
      display: grid;
      grid-template-columns: 420px 1fr;
      gap: 20px;
    }
    .panel, .preview {
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
      padding: 18px;
    }
    h1 { font-size: 24px; margin: 0 0 12px; }
    h2 { font-size: 18px; margin: 22px 0 10px; }
    h3 { font-size: 16px; margin: 16px 0 8px; }
    .muted { color: #6b7280; font-size: 13px; line-height: 1.6; }
    label { display: block; font-size: 14px; font-weight: 600; margin: 14px 0 6px; }
    input, textarea {
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      font-family: inherit;
    }
    textarea {
      min-height: 360px;
      resize: vertical;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      line-height: 1.45;
    }
    .btn-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 16px;
    }
    button {
      border: none;
      border-radius: 999px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .primary { background: #0f766e; color: #fff; }
    .secondary { background: #e5e7eb; color: #111827; }
    .danger { background: #b91c1c; color: #fff; }
    .report {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 24px;
      min-height: 720px;
    }
    .report[contenteditable="true"]:focus {
      outline: 2px solid #99f6e4;
    }
    .hero-box {
      background: #edf7f7;
      border: 1px solid #cfe8e8;
      border-radius: 12px;
      padding: 16px;
      margin: 12px 0 18px;
    }
    .score-badge {
      display: inline-block;
      background: #0f766e;
      color: #fff;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 13px;
      margin-bottom: 10px;
    }
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin: 14px 0;
    }
    .card {
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 12px;
    }
    .card .label { font-size: 12px; color: #6b7280; }
    .card .value { font-size: 20px; font-weight: 700; margin-top: 4px; }
    .radar-wrap {
      max-width: 420px;
      margin: 12px auto 20px;
    }
    ul { padding-left: 20px; line-height: 1.7; }
    .small { font-size: 12px; color: #6b7280; }
    .footer-note {
      margin-top: 22px;
      padding-top: 12px;
      border-top: 1px solid #e5e7eb;
      color: #6b7280;
      font-size: 12px;
      line-height: 1.6;
    }
    @media (max-width: 980px) {
      .page { grid-template-columns: 1fr; }
    }
    @media print {
      .panel { display: none; }
      .page { display: block; padding: 0; }
      .preview { box-shadow: none; padding: 0; }
      .report { border: none; }
    }
  </style>
</head>
<body>
  <div class="page">
    <section class="panel">
      <h1>LEOIVF 报告生成工具</h1>
      <div class="muted">把 Kajabi 结果页复制出来的全文粘贴到下面，工具会自动识别关键字段、计算成功率、生成 6 维度雷达，并输出可编辑报告。</div>

      <label for="sourceUrl">结果链接（可选，仅记录）</label>
      <input id="sourceUrl" type="text" placeholder="粘贴 Kajabi Assessment 结果链接" />

      <label for="rawText">结果页复制文本</label>
      <textarea id="rawText" placeholder="把 Kajabi assessment result 页面复制出来的全文粘贴到这里"></textarea>

      <div class="btn-row">
        <button class="primary" id="generateBtn">生成报告</button>
        <button class="secondary" id="pdfBtn">下载 PDF</button>
        <button class="secondary" id="sampleBtn">填入示例</button>
        <button class="danger" id="clearBtn">清空</button>
      </div>

      <p class="small">提示：生成后右侧报告内容可以直接手动修改，再下载 PDF。</p>
    </section>

    <section class="preview">
      <div id="report" class="report" contenteditable="true">
        <h2>报告预览区</h2>
        <p class="muted">请先在左侧粘贴结果文本，然后点击“生成报告”。</p>
      </div>
    </section>
  </div>

  <script>
    const sampleText = `Results Breakdown
你目前的年龄是？
Your Answer
check_box≤33岁
你最近一次检测的AMH值是多少？
Your Answer
check_box≥2.0 ng/mL
最近一次基础窦卵泡数（AFC）是多少？
Your Answer
check_box≥15个
你的基础FSH值（月经第2–3天）是多少？
Your Answer
check_box<8 IU/L
若你做过IVF，既往周期的优质胚胎（3BB以上）比例大概是多少？
Your Answer
check_box10–29%
你有过几次不明原因自然流产或胚胎停育？
Your Answer
check_box2次
是否做过PGT（胚胎染色体检测）？
Your Answer
check_box建议做但未做
伴侣最近一次精液常规结果如何？
Your Answer
check_box1项轻度偏低
精子形态正常率是多少？（Kruger严格标准）
Your Answer
check_box2–3.9%
最近一次精子 DNA 碎片率（DFI）结果如何？
Your Answer
check_box≤15%
是否发现子宫结构异常？
Your Answer
check_box有息肉/小肌瘤待处理
是否有子宫腺肌症或高度怀疑？
Your Answer
check_box明确没有
最近B超的内膜厚度情况如何？
Your Answer
check_box<6mm
是否有宫腔粘连史或宫腔镜手术史？
Your Answer
check_box没有
平均每晚睡眠时长及质量如何？
Your Answer
check_box6–7小时、偶尔不佳
你目前的运动习惯是？
Your Answer
check_box几乎不运动
你的饮食习惯整体如何？
Your Answer
check_box饮食不规律或偏单一
你的情绪状态整体如何？
Your Answer
check_box经常焦虑或情绪低落
最近一次甲状腺功能检查（TSH 为主）结果如何？
Your Answer
check_box正常且近期复查
是否有胰岛素抵抗或血糖偏高问题？ 
Your Answer
check_box轻度偏高已控制
是否有血脂异常（高胆固醇/高甘油三酯）？ 
Your Answer
check_box轻度偏高，生活方式干预中
是否有凝血或免疫相关异常史（如APS、易栓症）？ 
Your Answer
check_box无相关病史`;

    const ageMap = [
      { key: '≤33岁', value: 33, band: 'A1', label: '≤33岁' },
      { key: '34岁', value: 34, band: 'A2', label: '34岁' },
      { key: '35–37岁', value: 36, band: 'A3', label: '35–37岁' },
      { key: '35-37岁', value: 36, band: 'A3', label: '35–37岁' },
      { key: '38–40岁', value: 39, band: 'A4', label: '38–40岁' },
      { key: '38-40岁', value: 39, band: 'A4', label: '38–40岁' },
      { key: '≥41岁', value: 41, band: 'A5', label: '≥41岁' }
    ];

    const successMatrix = {
      O1: { A1: 60, A2: 55, A3: 45, A4: 35, A5: 25 },
      O2: { A1: 55, A2: 50, A3: 40, A4: 30, A5: 20 },
      O3: { A1: 50, A2: 45, A3: 35, A4: 25, A5: 15 },
      O4: { A1: 45, A2: 40, A3: 30, A4: 20, A5: 10 },
      O5: { A1: 40, A2: 35, A3: 25, A4: 15, A5: 10 }
    };

    let radarChart = null;

    function findAnswer(text, question) {
      const normalized = text.replace(/\r/g, '');
      const idx = normalized.indexOf(question);
      if (idx === -1) return '';
      const slice = normalized.slice(idx, idx + 240);
      const match = slice.match(/check_box([^\n]+)/);
      return match ? match[1].trim() : '';
    }

    function parseText(text) {
      const ageAnswer = findAnswer(text, '你目前的年龄是？');
      const ageInfo = ageMap.find(item => ageAnswer.includes(item.key)) || { value: 38, band: 'A4', label: '38–40岁' };

      const amhAnswer = findAnswer(text, '你最近一次检测的AMH值是多少？');
      let amh = 1.0;
      if (amhAnswer.includes('≥2.0')) amh = 2.1;
      else if (amhAnswer.includes('1.5')) amh = 1.7;
      else if (amhAnswer.includes('1.0')) amh = 1.2;
      else if (amhAnswer.includes('0.7')) amh = 0.8;
      else if (amhAnswer.includes('<0.7')) amh = 0.6;

      const afcAnswer = findAnswer(text, '最近一次基础窦卵泡数（AFC）是多少？');
      let afc = 5;
      if (afcAnswer.includes('≥15')) afc = 16;
      else if (afcAnswer.includes('10–14') || afcAnswer.includes('10-14')) afc = 12;
      else if (afcAnswer.includes('5–9') || afcAnswer.includes('5-9')) afc = 7;
      else if (afcAnswer.includes('3–4') || afcAnswer.includes('3-4')) afc = 3;
      else if (afcAnswer.includes('≤3') || afcAnswer.includes('<3')) afc = 2;

      const fshAnswer = findAnswer(text, '你的基础FSH值（月经第2–3天）是多少？');
      let fsh = 9;
      if (fshAnswer.includes('<8')) fsh = 7;
      else if (fshAnswer.includes('8–9.9') || fshAnswer.includes('8-9.9')) fsh = 9;
      else if (fshAnswer.includes('10–11.9') || fshAnswer.includes('10-11.9')) fsh = 11;
      else if (fshAnswer.includes('≥12')) fsh = 12.5;

      return {
        age: ageInfo.value,
        ageBand: ageInfo.band,
        ageLabel: ageInfo.label,
        amh,
        afc,
        fsh,
        embryoRatio: findAnswer(text, '若你做过IVF，既往周期的优质胚胎（3BB以上）比例大概是多少？'),
        miscarriage: findAnswer(text, '你有过几次不明原因自然流产或胚胎停育？'),
        pgt: findAnswer(text, '是否做过PGT（胚胎染色体检测）？'),
        semen: findAnswer(text, '伴侣最近一次精液常规结果如何？'),
        morphology: findAnswer(text, '精子形态正常率是多少？（Kruger严格标准）'),
        dfi: findAnswer(text, '最近一次精子 DNA 碎片率（DFI）结果如何？'),
        uterusIssue: findAnswer(text, '是否发现子宫结构异常？'),
        adenomyosis: findAnswer(text, '是否有子宫腺肌症或高度怀疑？'),
        endometrium: findAnswer(text, '最近B超的内膜厚度情况如何？'),
        adhesion: findAnswer(text, '是否有宫腔粘连史或宫腔镜手术史？'),
        sleep: findAnswer(text, '平均每晚睡眠时长及质量如何？'),
        exercise: findAnswer(text, '你目前的运动习惯是？'),
        diet: findAnswer(text, '你的饮食习惯整体如何？'),
        mood: findAnswer(text, '你的情绪状态整体如何？'),
        tsh: findAnswer(text, '最近一次甲状腺功能检查（TSH 为主）结果如何？'),
        glucose: findAnswer(text, '是否有胰岛素抵抗或血糖偏高问题？'),
        lipid: findAnswer(text, '是否有血脂异常（高胆固醇/高甘油三酯）？'),
        immune: findAnswer(text, '是否有凝血或免疫相关异常史（如APS、易栓症）？')
      };
    }

    function reserveBand(amh, afc) {
      if (amh >= 2.0 && afc >= 15) return { band: 'O1', label: '十分好' };
      if (amh >= 1.5 && afc >= 10) return { band: 'O2', label: '较好' };
      if (amh >= 1.0 && afc >= 5) return { band: 'O3', label: '中等' };
      if (amh >= 0.7 && afc >= 3) return { band: 'O4', label: '较低' };
      return { band: 'O5', label: '很低' };
    }

    function calcSuccessRate(data) {
      const reserve = reserveBand(data.amh, data.afc);
      return {
        reserveBand: reserve.band,
        reserveLabel: reserve.label,
        successRate: successMatrix[reserve.band][data.ageBand]
      };
    }

    function calcRadar(data) {
      let lifestyle = 78;
      if (data.sleep.includes('6–7小时') || data.sleep.includes('6-7小时')) lifestyle -= 6;
      if (data.exercise.includes('几乎不运动')) lifestyle -= 18;
      if (data.diet.includes('不规律')) lifestyle -= 12;
      if (data.mood.includes('经常焦虑')) lifestyle -= 16;

      let ovary = 82;
      if (data.amh >= 2 && data.afc >= 15) ovary = 90;
      else if (data.amh >= 1.5 && data.afc >= 10) ovary = 80;
      else if (data.amh >= 1.0 && data.afc >= 5) ovary = 70;
      else if (data.amh >= 0.7) ovary = 55;
      else ovary = 40;
      if (data.fsh >= 10) ovary -= 8;

      let uterus = 78;
      if (data.uterusIssue.includes('息肉') || data.uterusIssue.includes('肌瘤')) uterus -= 18;
      if (data.endometrium.includes('<6mm')) uterus -= 20;
      if (data.adenomyosis.includes('明确没有')) uterus += 5;
      if (data.adhesion.includes('没有')) uterus += 3;

      let endocrine = 78;
      if (data.tsh.includes('正常')) endocrine += 5;
      if (data.glucose.includes('轻度偏高')) endocrine -= 12;
      if (data.lipid.includes('轻度偏高')) endocrine -= 10;

      let immune = 75;
      if (data.immune.includes('无相关病史')) immune = 85;
      else if (data.immune) immune = 60;

      let history = 72;
      if (data.embryoRatio.includes('10–29') || data.embryoRatio.includes('10-29')) history = 60;
      if (data.pgt.includes('建议做但未做')) history -= 5;
      if (data.miscarriage.includes('2次')) history -= 10;
      if (data.semen.includes('1项轻度偏低')) history -= 5;
      if (data.morphology.includes('2–3.9') || data.morphology.includes('2-3.9')) history -= 8;
      if (data.dfi.includes('≤15')) history += 3;

      const normalize = v => Math.max(20, Math.min(95, Math.round(v)));
      const result = {
        lifestyle: normalize(lifestyle),
        ovary: normalize(ovary),
        uterus: normalize(uterus),
        endocrine: normalize(endocrine),
        immune: normalize(immune),
        history: normalize(history)
      };
      return result;
    }

    function rateLabel(rate) {
      if (rate <= 10) return '极低';
      if (rate <= 25) return '偏低';
      if (rate <= 45) return '中等';
      if (rate <= 60) return '偏高';
      return '较高';
    }

    function buildSuggestions(scores, data) {
      const items = [];
      if (scores.uterus < 65) {
        items.push('子宫环境与内膜是当前最需要优先处理的环节。若存在息肉、小肌瘤待处理或内膜偏薄，建议与生殖医生讨论是否先完成宫腔评估/处理，再进入下一次移植或促排周期。');
      }
      if (scores.lifestyle < 65) {
        items.push('生活方式与情绪维度存在明显优化空间。建议先把睡眠、规律运动和饮食结构作为未来 6–8 周的基础任务，同时加入焦虑管理，以减少对内分泌和治疗依从性的影响。');
      }
      if (scores.endocrine < 70) {
        items.push('内分泌与代谢方面建议继续巩固血糖、血脂等指标的控制，尽量在下个治疗周期前复查并拿到更稳定的数据结果。');
      }
      if (scores.history < 65) {
        items.push('既往 IVF 结果提示需要做更系统的复盘。建议重点复盘胚胎形成率、优质胚胎率、是否需要补做 PGT，以及男方因素对胚胎质量的潜在影响。');
      }
      if (scores.ovary < 65) {
        items.push('卵巢功能与卵子潜力提示可用卵子数量或反应性存在限制，下一步更适合采用“现实预期 + 优化策略”并行的方式，而不是单纯增加尝试次数。');
      }
      if (scores.immune < 70 && !data.immune.includes('无相关病史')) {
        items.push('若既往存在免疫或凝血相关提示，建议在进入下一周期前进行更明确的分层评估，避免遗漏影响着床或早期妊娠维持的因素。');
      }
      if (items.length < 3) {
        items.push('目前最合理的路径不是盲目立即重复同方案，而是先把可明确优化的环节做成一份 1–3 个月行动计划，再进入下一次 IVF/移植准备。');
      }
      return items;
    }

    function createReport(data, success, scores, sourceUrl) {
      const level = rateLabel(success.successRate);
      const suggestions = buildSuggestions(scores, data);
      return `
        <h1>IVF 综合生育力评估报告</h1>
        <p class="muted">本报告基于你在 LEOIVF Assessment 的结果文本生成，用于帮助你理解当前整体成功率区间、关键影响维度及下一步优化方向。</p>

        <div class="hero-box">
          <div class="score-badge">综合档位：${level}</div>
          <p><strong>综合年龄、卵巢储备、既往胚胎表现、子宫环境及生活方式等因素，当前下一次 IVF 周期的整体成功率约为 ${success.successRate}% 。</strong></p>
          <p>年龄挡位：${data.ageLabel}；卵巢储备挡位：${success.reserveLabel}。该结果用于辅助决策，不代表对单次结局的精确预测。</p>
          ${sourceUrl ? `<p class="small">原始结果链接：${sourceUrl}</p>` : ''}
        </div>

        <div class="summary-grid">
          <div class="card"><div class="label">年龄</div><div class="value">${data.ageLabel}</div></div>
          <div class="card"><div class="label">AMH / AFC</div><div class="value">${data.amh} / ${data.afc}</div></div>
          <div class="card"><div class="label">基础 FSH</div><div class="value">${data.fsh}</div></div>
          <div class="card"><div class="label">成功率区间</div><div class="value">${success.successRate}%</div></div>
        </div>

        <h2>一、当前综合生育力雷达</h2>
        <div class="radar-wrap"><canvas id="radarCanvas"></canvas></div>
        <ul>
          <li><strong>生活方式与情绪：</strong>${scores.lifestyle} 分</li>
          <li><strong>卵巢功能与卵子：</strong>${scores.ovary} 分</li>
          <li><strong>子宫环境与内膜：</strong>${scores.uterus} 分</li>
          <li><strong>内分泌与代谢：</strong>${scores.endocrine} 分</li>
          <li><strong>免疫/凝血风险：</strong>${scores.immune} 分</li>
          <li><strong>既往 IVF 周期结果：</strong>${scores.history} 分</li>
        </ul>

        <h2>二、主要发现</h2>
        <ul>
          <li>你的年龄与卵巢储备组合对应当前成功率基线，其中年龄处于 <strong>${data.ageLabel}</strong>，卵巢储备评估为 <strong>${success.reserveLabel}</strong>。</li>
          <li>子宫环境方面目前最值得关注的是：${data.uterusIssue || '未提取到明确异常'}；内膜情况为：${data.endometrium || '未提取到'}。</li>
          <li>生活方式相关结果显示：睡眠为“${data.sleep || '未提取到'}”，运动为“${data.exercise || '未提取到'}”，饮食为“${data.diet || '未提取到'}”，情绪状态为“${data.mood || '未提取到'}”。</li>
          <li>代谢与全身状态方面：TSH/甲状腺为“${data.tsh || '未提取到'}”，血糖为“${data.glucose || '未提取到'}”，血脂为“${data.lipid || '未提取到'}”。</li>
          <li>既往 IVF / 胚胎信息中，优质胚胎比例为“${data.embryoRatio || '未提取到'}”，PGT 状态为“${data.pgt || '未提取到'}”。</li>
        </ul>

        <h2>三、个性化建议</h2>
        <ul>
          ${suggestions.map(item => `<li>${item}</li>`).join('')}
        </ul>

        <h2>四、下一步行动方向</h2>
        <p>建议把接下来 1–3 个月作为“系统复盘 + 重点优化”阶段，而不是直接重复上一次路径。优先顺序通常可按：子宫/内膜问题处理 → 生活方式与情绪稳定 → 代谢指标再校正 → 周期方案复盘与是否补做检查。</p>
        <p>如果你计划较快进入下一次 IVF，可把本报告作为与你的生殖医生沟通的提纲，并在此基础上人工补充病史、实验室结果和既往周期细节。</p>

        <div class="footer-note">
          说明：本工具为配置化辅助评估版本，基于问卷文本中的已识别字段自动生成，不替代面对面医疗诊断。报告生成后可手动修改，用于内部咨询或客户沟通前的初稿整理。
        </div>
      `;
    }

    function renderRadar(scores) {
      const canvas = document.getElementById('radarCanvas');
      if (!canvas || typeof Chart === 'undefined') return;
      const ctx = canvas.getContext('2d');
      if (radarChart) radarChart.destroy();
      radarChart = new Chart(ctx, {
        type: 'radar',
        data: {
          labels: ['生活方式与情绪', '卵巢功能与卵子', '子宫环境与内膜', '内分泌与代谢', '免疫/凝血风险', '既往IVF周期结果'],
          datasets: [{
            label: '综合评分',
            data: [scores.lifestyle, scores.ovary, scores.uterus, scores.endocrine, scores.immune, scores.history],
            fill: true,
            backgroundColor: 'rgba(15, 118, 110, 0.2)',
            borderColor: 'rgba(15, 118, 110, 1)',
            pointBackgroundColor: 'rgba(15, 118, 110, 1)',
            pointBorderColor: '#fff',
            pointHoverBackgroundColor: '#fff',
            pointHoverBorderColor: 'rgba(15, 118, 110, 1)'
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } },
          scales: {
            r: {
              suggestedMin: 20,
              suggestedMax: 100,
              ticks: { stepSize: 20 }
            }
          }
        }
      });
    }

    document.getElementById('sampleBtn').addEventListener('click', () => {
      document.getElementById('rawText').value = sampleText;
    });

    document.getElementById('clearBtn').addEventListener('click', () => {
      document.getElementById('sourceUrl').value = '';
      document.getElementById('rawText').value = '';
      document.getElementById('report').innerHTML = '<h2>报告预览区</h2><p class="muted">请先在左侧粘贴结果文本，然后点击“生成报告”。</p>';
      if (radarChart) {
        radarChart.destroy();
        radarChart = null;
      }
    });

    document.getElementById('generateBtn').addEventListener('click', () => {
      const rawText = document.getElementById('rawText').value.trim();
      const sourceUrl = document.getElementById('sourceUrl').value.trim();
      if (!rawText) {
        alert('请先粘贴 Kajabi 结果文本。');
        return;
      }
      try {
        const data = parseText(rawText);
        const success = calcSuccessRate(data);
        const scores = calcRadar(data);
        document.getElementById('report').innerHTML = createReport(data, success, scores, sourceUrl);
        setTimeout(() => renderRadar(scores), 50);
      } catch (e) {
        console.error(e);
        alert('生成失败，请检查文本格式是否接近 Kajabi 结果页复制内容。');
      }
    });

    document.getElementById('pdfBtn').addEventListener('click', () => {
      const report = document.getElementById('report');
      const opt = {
        margin: 10,
        filename: 'LEOIVF-综合生育力评估报告.pdf',
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2, useCORS: true },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };
      html2pdf().set(opt).from(report).save();
    });
  </script>
</body>
</html>
